<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="730" viewBox="0 0 1360 730">
<rect width="100%" height="100%" fill="white"/>
<text x="36" y="44" fill="#17314f" font-family="Microsoft YaHei,Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start">系统数据流图：上下文</text>
<text x="36" y="76" fill="#627c90" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">单机系统的输入、输出与外部接口；不将模型 API 视为数据库计算器。</text>
<polyline points="315,211.0 505,211.0" stroke="#7892a4" stroke-width="1.7" fill="none"/>
<polygon points="505.0,211.0 496.9,214.9 496.9,207.1" fill="#7892a4"/>
