{% if page_obj.has_other_pages %}<nav class="pagination-row" aria-label="结果分页"><span>第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页，共 {{ page_obj.paginator.count }} 条</span><div>{% if page_obj.has_previous %}<a class="btn btn-outline-primary btn-sm" href="?page={{ page_obj.previous_page_number }}&amp;{{ querystring }}{% if outcome %}&amp;outcome={{ outcome|urlencode }}{% endif %}{% if fragment %}#{{ fragment }}{% endif %}">上一页</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-outline-primary btn-sm" href="?page={{ page_obj.next_page_number }}&amp;{{ querystring }}{% if outcome %}&amp;outcome={{ outcome|urlencode }}{% endif %}{% if fragment %}#{{ fragment }}{% endif %}">下一页</a>{% endif %}</div></nav>{% endif %}
